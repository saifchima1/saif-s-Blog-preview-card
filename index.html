<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body{
      background-color: #FFE761;
    }
    .card{
      width: 375px;
      height: 500px;
      margin: auto;
      background-color: white;
      border-radius: 10px;
      box-shadow: 10px 10px;
    }
    @font-face{
      font-family: 'figtree';
      src: url('assets/fonts/Figtree-VariableFont_wght.ttf') format('normal');
      src: url('assets/fonts/Figtree-Italic-VariableFont_wght.ttf') format('italic');
    }
    .profile{
      display: flex;
      flex-direction:row;
      margin-left: 20px;
      margin-top: 35px;
    }

  </style>
</head>
<body>
  <div class="card">
    <img src="assets/images/illustration-article.svg" style="border-radius:15px;height: 200px; margin-left: 20px; margin-right: 20px;margin-top: 15px;" alt="illustration-article">
    <p style="background-color: #FFE761;border-radius: 3px;text-align: center;font-family: 'figtree', sans-serif ;font-size: 13px; height: 22px;width: 75px;padding-top: 7px;margin-left: 20px;"><b>Learning</b></p>
    <p style="font-family: 'fegtree',sans-serif;font-size: small; margin-left: 20px;">Published 21 Dec 2026</p>
    <h1 style="font-family: 'fegtree', sans-serif; font-size:x-large; margin-left: 20px;">HTML & CSS foundations</h1>
    <p style="font-family: 'fegtree', sans-serif; color: rgb(113, 112, 112); margin-left: 20px;">these languages are the backbone for every website,defining structure,content,and presentation.</p>
    <div class="profile">
      <img src="assets/images/image-avatar.webp" alt="image-avatar" height="40px"><p style="font-family: 'fegtree', sans-serif;font-size: small;margin-left: 15px;"><b>Greg Hooper</b></p>
    </div>

  </div>
</body>
</html>
